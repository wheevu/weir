<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
  <title id="title">Weir transport backends</title>
  <desc id="desc">Three nonblocking TCP servers (epoll, coroutine plus epoll, coroutine plus io_uring) are selected by --backend and converge on one incremental frame parser, then the shared durability and processing pipeline.</desc>
  <defs>
    <marker id="w-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93643a"/>
    </marker>
    <marker id="w-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f7d84"/>
    </marker>
    <style>
      .canvas { fill: #fbfaf7; }
      .title { fill: #20262d; font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #69727a; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .note-strong { fill: #20262d; font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .node rect { fill: #ffffff; stroke: #2e3942; stroke-width: 2; rx: 12; }
      .node .label { fill: #20262d; font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .node .detail { fill: #69727a; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .node .number { fill: #93643a; font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .flow { fill: none; stroke: #93643a; stroke-width: 2.5; marker-end: url(#w-arrow); }
      .flow-teal { fill: none; stroke: #3f7d84; stroke-width: 2.5; marker-end: url(#w-arrow-teal); }
      .note { fill: #4f5b63; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="canvas" width="1280" height="600"/>
  <text class="title" x="40" y="52">Weir / transport backends</text>
  <text class="subtitle" x="40" y="79">One of three nonblocking TCP servers, one shared frame path.</text>
  <text class="note-strong" x="40" y="120">--backend selects one transport</text>

  <g class="node" transform="translate(70 140)">
    <rect width="240" height="120"/>
    <text class="number" x="18" y="26">01</text>
    <text class="label" x="120" y="58">epoll legacy</text>
    <text class="detail" x="120" y="84">nonblocking TCP</text>
    <text class="detail" x="120" y="106">event loop</text>
  </g>
  <g class="node" transform="translate(440 140)">
    <rect width="240" height="120"/>
    <text class="number" x="18" y="26">02</text>
    <text class="label" x="120" y="58">coroutine + epoll</text>
    <text class="detail" x="120" y="84">C++20 coroutines</text>
    <text class="detail" x="120" y="106">over epoll</text>
  </g>
  <g class="node" transform="translate(810 140)">
    <rect width="240" height="120"/>
    <text class="number" x="18" y="26">03</text>
    <text class="label" x="120" y="58">coroutine + io_uring</text>
    <text class="detail" x="120" y="84">poll mode</text>
    <text class="detail" x="120" y="106">C++20 coroutines</text>
  </g>

  <g class="node" transform="translate(520 330)">
    <rect width="240" height="90"/>
    <text class="number" x="18" y="26">04</text>
    <text class="label" x="120" y="52">incremental frame parser</text>
    <text class="detail" x="120" y="76">WR01 length-delimited</text>
  </g>
  <path class="flow-teal" d="M190 260 C 190 300, 450 300, 570 330"/>
  <path class="flow-teal" d="M560 260 C 560 300, 620 300, 640 330"/>
  <path class="flow-teal" d="M930 260 C 930 300, 830 300, 710 330"/>
  <path class="flow" d="M640 420 V470"/>

  <g class="node" transform="translate(60 470)">
    <rect width="200" height="90"/>
    <text class="number" x="18" y="26">05</text>
    <text class="label" x="100" y="52">durability queue</text>
    <text class="detail" x="100" y="76">bounded 256</text>
  </g>
  <g class="node" transform="translate(300 470)">
    <rect width="200" height="90"/>
    <text class="number" x="18" y="26">06</text>
    <text class="label" x="100" y="52">append-only log</text>
    <text class="detail" x="100" y="76">append + flush</text>
  </g>
  <g class="node" transform="translate(540 470)">
    <rect width="200" height="90"/>
    <text class="number" x="18" y="26">07</text>
    <text class="label" x="100" y="52">processing queue</text>
    <text class="detail" x="100" y="76">bounded 256</text>
  </g>
  <g class="node" transform="translate(820 470)">
    <rect width="200" height="90"/>
    <text class="number" x="18" y="26">08</text>
    <text class="label" x="100" y="52">worker threads</text>
    <text class="detail" x="100" y="76">process events</text>
  </g>
  <path class="flow" d="M260 515 H300"/>
  <path class="flow" d="M500 515 H540"/>
  <path class="flow" d="M740 515 H820"/>

  <text class="note" x="40" y="580">Throughput is transport-boundary-independent: the durable persistence pipeline saturates first.</text>
</svg>
