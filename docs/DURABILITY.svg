<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Weir durability boundary</title>
  <desc id="desc">An event is queued for persistence, appended and flushed to the append-only log, then acknowledged. A log write failure skips processing. On restart the log is replayed to rebuild state.</desc>
  <defs>
    <marker id="w-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93643a"/>
    </marker>
    <marker id="w-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a14e42"/>
    </marker>
    <marker id="w-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f7d84"/>
    </marker>
    <style>
      .canvas { fill: #fbfaf7; }
      .title { fill: #20262d; font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #69727a; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .node rect { fill: #ffffff; stroke: #2e3942; stroke-width: 2; rx: 11; }
      .node .label { fill: #20262d; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .node .number { fill: #93643a; font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .flow { fill: none; stroke: #93643a; stroke-width: 2.4; marker-end: url(#w-arrow); }
      .error-box rect { fill: #fff8f6; stroke: #a14e42; stroke-width: 2; rx: 11; }
      .error-box .label { fill: #78382f; font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .error { fill: none; stroke: #a14e42; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#w-arrow-red); }
      .recover rect { fill: #ffffff; stroke: #3f7d84; stroke-width: 2; rx: 11; }
      .recover .label { fill: #2c5d63; font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .recover-flow { fill: none; stroke: #3f7d84; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#w-arrow-teal); }
      .note { fill: #4f5b63; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="canvas" width="1200" height="460"/>
  <text class="title" x="35" y="50">Weir / durability boundary</text>
  <text class="subtitle" x="35" y="77">Persistence comes before processing; the ACK is still queued on the network loop.</text>

  <g class="node" transform="translate(40 130)">
    <rect width="130" height="64"/>
    <text class="number" x="14" y="23">01</text>
    <text class="label" x="65" y="49">Received</text>
  </g>
  <g class="node" transform="translate(200 130)">
    <rect width="150" height="64"/>
    <text class="number" x="14" y="23">02</text>
    <text class="label" x="75" y="49">Persistence queue</text>
  </g>
  <g class="node" transform="translate(370 130)">
    <rect width="160" height="64"/>
    <text class="number" x="14" y="23">03</text>
    <text class="label" x="80" y="49">Append + flush</text>
  </g>
  <g class="node" transform="translate(560 130)">
    <rect width="150" height="64"/>
    <text class="number" x="14" y="23">04</text>
    <text class="label" x="75" y="49">ACK queued</text>
  </g>
  <g class="node" transform="translate(740 130)">
    <rect width="160" height="64"/>
    <text class="number" x="14" y="23">05</text>
    <text class="label" x="80" y="49">Processing queue</text>
  </g>
  <g class="node" transform="translate(920 130)">
    <rect width="130" height="64"/>
    <text class="number" x="14" y="23">06</text>
    <text class="label" x="65" y="49">Processed</text>
  </g>

  <path class="flow" d="M170 162 H200"/>
  <path class="flow" d="M350 162 H370"/>
  <path class="flow" d="M530 162 H560"/>
  <path class="flow" d="M710 162 H740"/>
  <path class="flow" d="M900 162 H920"/>

  <g class="error-box" transform="translate(370 250)">
    <rect width="200" height="60"/>
    <text class="label" x="100" y="27">ERR log write</text>
    <text class="label" x="100" y="47">no processing</text>
  </g>
  <path class="error" d="M450 194 V250"/>

  <g class="recover" transform="translate(560 340)">
    <rect width="320" height="60"/>
    <text class="label" x="160" y="27">recover: replay WAL</text>
    <text class="label" x="160" y="47">rebuild committed state</text>
  </g>
  <path class="recover-flow" d="M530 194 C 600 280, 640 300, 720 340"/>

  <text class="note" x="35" y="440">Baseline boundary: userspace flush, not fdatasync. Crash recovery replays the append-only log.</text>
</svg>
