<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Weir architecture</title>
  <desc id="desc">TCP clients send framed events through an epoll loop and parser, a bounded durability queue, an append-only log, a bounded processing queue, and worker threads. Metrics flow to Prometheus.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93643a"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52727b"/>
    </marker>
    <style>
      .canvas { fill: #fbfaf7; }
      .title { fill: #20262d; font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #69727a; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .node rect { fill: #ffffff; stroke: #2e3942; stroke-width: 2; rx: 12; }
      .node .label { fill: #20262d; font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .node .detail { fill: #69727a; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .node .number { fill: #93643a; font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .flow { fill: none; stroke: #93643a; stroke-width: 2.5; marker-end: url(#arrow); }
      .metrics { fill: none; stroke: #52727b; stroke-width: 2.5; marker-end: url(#arrow-muted); }
      .branch { fill: none; stroke: #93643a; stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#arrow); }
      .note { fill: #4f5b63; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .note-strong { fill: #20262d; font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tag { fill: #efe7dc; }
      .tag-text { fill: #704b2d; font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="canvas" width="1280" height="560"/>
  <text class="title" x="40" y="52">Weir / event flow</text>
  <text class="subtitle" x="40" y="79">One process, two bounded stages, one explicit persistence boundary.</text>

  <g class="node" transform="translate(40 180)">
    <rect width="160" height="96"/>
    <text class="number" x="18" y="25">01</text>
    <text class="label" x="80" y="54">TCP clients</text>
    <text class="detail" x="80" y="77">framed events</text>
  </g>
  <g class="node" transform="translate(245 180)">
    <rect width="190" height="96"/>
    <text class="number" x="18" y="25">02</text>
    <text class="label" x="95" y="51">epoll loop</text>
    <text class="detail" x="95" y="75">+ incremental parser</text>
  </g>
  <g class="node" transform="translate(480 180)">
    <rect width="190" height="96"/>
    <text class="number" x="18" y="25">03</text>
    <text class="label" x="95" y="51">durability queue</text>
    <text class="detail" x="95" y="75">bounded 256</text>
  </g>
  <g class="node" transform="translate(715 180)">
    <rect width="190" height="96"/>
    <text class="number" x="18" y="25">04</text>
    <text class="label" x="95" y="51">append-only log</text>
    <text class="detail" x="95" y="75">append + flush</text>
  </g>
  <g class="node" transform="translate(950 180)">
    <rect width="190" height="96"/>
    <text class="number" x="18" y="25">05</text>
    <text class="label" x="95" y="51">processing queue</text>
    <text class="detail" x="95" y="75">bounded 256</text>
  </g>
  <g class="node" transform="translate(1170 180)">
    <rect width="90" height="96"/>
    <text class="number" x="14" y="25">06</text>
    <text class="label" x="45" y="51">worker</text>
    <text class="detail" x="45" y="75">threads</text>
  </g>

  <path class="flow" d="M 200 228 H 245"/>
  <path class="flow" d="M 435 228 H 480"/>
  <path class="flow" d="M 670 228 H 715"/>
  <path class="flow" d="M 905 228 H 950"/>
  <path class="flow" d="M 1140 228 H 1170"/>

  <g class="node" transform="translate(715 80)">
    <rect width="190" height="58"/>
    <text class="label" x="95" y="36">ACK queued</text>
  </g>
  <path class="flow" d="M 810 180 V 138"/>
  <rect class="tag" x="824" y="150" width="80" height="22" rx="11"/>
  <text class="tag-text" x="864" y="165">success</text>

  <g class="node" transform="translate(245 385)">
    <rect width="190" height="86"/>
    <text class="number" x="18" y="25">M1</text>
    <text class="label" x="95" y="52">metrics registry</text>
    <text class="detail" x="95" y="74">shared counters</text>
  </g>
  <g class="node" transform="translate(480 385)">
    <rect width="190" height="90"/>
    <text class="number" x="18" y="25">M2</text>
    <text class="label" x="95" y="52">metrics endpoint</text>
    <text class="detail" x="95" y="74">HTTP :9100</text>
  </g>
  <g class="node" transform="translate(715 385)">
    <rect width="190" height="90"/>
    <text class="number" x="18" y="25">M3</text>
    <text class="label" x="95" y="52">Prometheus</text>
    <text class="detail" x="95" y="74">scrape target</text>
  </g>
  <path class="metrics" d="M 1045 276 C 1045 340, 420 340, 340 385"/>
  <path class="metrics" d="M 435 428 H 480"/>
  <path class="metrics" d="M 670 428 H 715"/>

  <text class="note-strong" x="40" y="520">Current baseline:</text>
  <text class="note" x="166" y="520"> userspace flush precedes ACK generation and processing admission.</text>
</svg>
