<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Weir observability</title>
  <desc id="desc">A shared metrics registry feeds an HTTP endpoint, which Prometheus scrapes and Grafana renders as a live dashboard of throughput, lag, and role state.</desc>
  <defs>
    <marker id="w-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93643a"/>
    </marker>
    <marker id="w-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f7d84"/>
    </marker>
    <style>
      .canvas { fill: #fbfaf7; }
      .title { fill: #20262d; font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #69727a; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .node rect { fill: #ffffff; stroke: #2e3942; stroke-width: 2; rx: 12; }
      .node .label { fill: #20262d; font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .node .detail { fill: #69727a; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .node .number { fill: #93643a; font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .group { fill: #f0eee9; stroke: #c7c1b8; stroke-width: 1.5; rx: 16; }
      .group-title { fill: #69727a; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .detail-list { fill: #69727a; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .flow { fill: none; stroke: #93643a; stroke-width: 2.5; marker-end: url(#w-arrow); }
      .flow-teal { fill: none; stroke: #3f7d84; stroke-width: 2.5; marker-end: url(#w-arrow-teal); }
      .note { fill: #4f5b63; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="canvas" width="960" height="540"/>
  <text class="title" x="40" y="52">Weir / observability</text>
  <text class="subtitle" x="40" y="79">Metrics flow to Prometheus and Grafana; structured logs stay local.</text>

  <g class="node" transform="translate(48 140)">
    <rect width="180" height="72"/>
    <text class="number" x="16" y="24">M1</text>
    <text class="label" x="98" y="48">metrics registry</text>
    <text class="detail" x="98" y="70">shared counters</text>
  </g>
  <g class="node" transform="translate(48 264)">
    <rect width="180" height="88"/>
    <text class="number" x="16" y="24">M2</text>
    <text class="label" x="98" y="48">HTTP endpoint</text>
    <text class="detail" x="98" y="76">:9100 /metrics</text>
  </g>
  <g class="node" transform="translate(330 180)">
    <rect width="200" height="96"/>
    <text class="number" x="16" y="24">M3</text>
    <text class="label" x="110" y="50">Prometheus</text>
    <text class="detail" x="110" y="74">scrape every 2s</text>
  </g>
  <g class="node" transform="translate(600 180)">
    <rect width="200" height="96"/>
    <text class="number" x="16" y="24">M4</text>
    <text class="label" x="110" y="50">Grafana</text>
    <text class="detail" x="110" y="74">preloaded dashboard</text>
  </g>

  <rect class="group" x="570" y="350" width="260" height="155"/>
  <text class="group-title" x="590" y="380">dashboard panels</text>
  <text class="detail-list" x="590" y="412">throughput</text>
  <text class="detail-list" x="590" y="436">replication lag</text>
  <text class="detail-list" x="590" y="460">role map</text>
  <text class="detail-list" x="590" y="484">compactions · queue depth</text>

  <path class="flow" d="M138 212 V264"/>
  <path class="flow-teal" d="M228 300 C 280 290, 300 230, 328 228"/>
  <path class="flow" d="M530 228 H600"/>
  <path class="flow" d="M700 276 V350"/>

  <text class="note" x="40" y="525">Metrics endpoint is unauthenticated; bind to localhost for local demos.</text>
</svg>
